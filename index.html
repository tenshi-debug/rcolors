<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Un ramo para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Un ramo para ti</h1>
    <p class="sub" id="sub">Presiona el botón y tu ramo de rosas aparecerá.</p>

    <button id="btnCrear" class="btn" type="button">Crear ramo</button>

    <section id="escenario" class="escenario" hidden>
      <svg id="ramo" class="ramo" viewBox="0 0 400 520" role="img" aria-label="Ramo de rosas"></svg>

      <div class="controles">
        <label class="selector" for="color">
          <span>Color de las rosas</span>
          <input type="color" id="color" value="#d62839">
        </label>
        <output id="hex" for="color">#d62839</output>

        <div class="muestras" role="group" aria-label="Colores sugeridos">
          <button type="button" data-color="#d62839" style="--c:#d62839" aria-label="Rojo"></button>
          <button type="button" data-color="#ff6fa5" style="--c:#ff6fa5" aria-label="Rosa"></button>
          <button type="button" data-color="#f5f0e6" style="--c:#f5f0e6" aria-label="Blanco"></button>
          <button type="button" data-color="#ffc233" style="--c:#ffc233" aria-label="Amarillo"></button>
          <button type="button" data-color="#ff7a3d" style="--c:#ff7a3d" aria-label="Naranja"></button>
          <button type="button" data-color="#8a5cf6" style="--c:#8a5cf6" aria-label="Morado"></button>
          <button type="button" data-color="#2f7bff" style="--c:#2f7bff" aria-label="Azul"></button>
        </div>
      </div>
    </section>
  </main>

  <!-- Dibujo de una rosa, reutilizado por el JavaScript -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="rosa" viewBox="-50 -50 100 100" overflow="visible">
        <g class="capa-ext">
          <path id="petalo" d="M0,-34C22,-34 34,-16 30,2C26,22 10,32 0,32C-10,32 -26,22 -30,2C-34,-16 -22,-34 0,-34Z" transform="rotate(0) translate(0,-18) scale(.62)"/>
          <use href="#petalo" transform="rotate(60)"/>
          <use href="#petalo" transform="rotate(120)"/>
          <use href="#petalo" transform="rotate(180)"/>
          <use href="#petalo" transform="rotate(240)"/>
          <use href="#petalo" transform="rotate(300)"/>
        </g>
        <g class="capa-med">
          <path id="petalo2" d="M0,-34C22,-34 34,-16 30,2C26,22 10,32 0,32C-10,32 -26,22 -30,2C-34,-16 -22,-34 0,-34Z" transform="rotate(20) translate(0,-11) scale(.46)"/>
          <use href="#petalo2" transform="rotate(72)"/>
          <use href="#petalo2" transform="rotate(144)"/>
          <use href="#petalo2" transform="rotate(216)"/>
          <use href="#petalo2" transform="rotate(288)"/>
        </g>
        <g class="capa-int">
          <path id="petalo3" d="M0,-34C22,-34 34,-16 30,2C26,22 10,32 0,32C-10,32 -26,22 -30,2C-34,-16 -22,-34 0,-34Z" transform="rotate(45) translate(0,-6) scale(.3)"/>
          <use href="#petalo3" transform="rotate(90)"/>
          <use href="#petalo3" transform="rotate(180)"/>
          <use href="#petalo3" transform="rotate(270)"/>
        </g>
        <circle class="centro" r="5"/>
        <path class="espiral" d="M0,0 m-2,0 a2,2 0 1,1 3,2 a4,4 0 1,1 -6,-3 a6.5,6.5 0 1,1 9,4"/>
      </symbol>
    </defs>
  </svg>

  <script src="script.js"></script>
</body>
</html>
